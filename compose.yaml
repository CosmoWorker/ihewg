services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - "8000:8000"
        env_file:
            - ./server/.env
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
            interval: 1m30s
            timeout: 30s
            retries: 5
            start_period: 30s

    client:
        build:
            context: ./client
            dockerfile: Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-http://server:8000}
        restart: unless-stopped
        ports:
            - "5173:5173"
        volumes:
            - ./client:/app
            - /app/node_modules
        environment:
            # Must use the Docker service name, not localhost.
            - VITE_PROXY_TARGET=http://server:8000
        depends_on:
            - server
        env_file:
            - ./client/.env
