services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        restart: unless-stopped
        ports: 
            - "8000:8000"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
            interval: 1m30s
            timeout: 30s
            retries: 5
            start_period: 30s

    client:
        build:
            context: ./client
            dockerfile: Dockerfile
        restart: unless-stopped
        ports: 
            - "5173:5173"
        volumes: 
            - ./client:/app 
            - /app/node_modules
        depends_on:
            - server
